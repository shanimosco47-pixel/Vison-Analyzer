[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-analyzer"
version = "0.1.0"
description = "Local analysis of recorded industrial video: Zahn cup efflux timing and machine activity detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - internal use" }

# Dependency policy (see README, "Dependencies and licensing"):
#   * mature, widely adopted projects only;
#   * bounded versions, so an upstream major release cannot silently change
#     behaviour of an installation made months later;
#   * every one of these is permissively licensed (Apache-2.0 / BSD / MIT).
dependencies = [
    "opencv-python-headless>=4.9,<5",  # Apache-2.0. Video I/O and all vision work.
    "numpy>=1.26,<3",                  # BSD-3-Clause. Array maths.
    "flask>=3.0,<4",                   # BSD-3-Clause. Local web server.
    "pandas>=2.1,<3",                  # BSD-3-Clause. Optional DataFrame export only.
]

[project.optional-dependencies]
# Development and quality gates.
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]
# Object detection. NOT installed by default and NOT used by any current mode.
# Ultralytics is AGPL-3.0 with a separate commercial licence; that has to be
# reviewed before it becomes a requirement for internal commercial use.
detection = [
    "ultralytics>=8.2,<9",
]

[project.scripts]
video-analyzer = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplification
    "PTH",  # prefer pathlib over os.path
    "RET",  # return statements
    "C4",   # comprehensions
]
ignore = [
    "B008",  # function call in default argument: used deliberately for null_progress
    # Empty methods on the detector base classes are optional hooks with a
    # working no-op default (reset, configure). Making them abstract would
    # force every detector to implement something it does not need.
    "B027",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = "^tests/"
